<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get EMOY</title>
<meta name="description" content="EMOY — one shared baby record every caregiver writes to. You choose what leaves the household.">

<!-- /invite is now /get. This page is a REDIRECT, not a page.
     GitHub Pages serves static files only — there is no way to return a real
     301 here — so the redirect is a meta refresh with a visible link behind it
     for anyone it fails for. It stays because this URL was handed out before
     /get existed and is sitting in people's messages; deleting the file would
     turn every one of those into a 404. rel=canonical points at /get so search
     engines credit the real page rather than this one. -->
<meta http-equiv="refresh" content="0; url=/get">
<link rel="canonical" href="https://emoy.app/get">

<!-- An old link pasted into a message still previews as the real page. -->
<meta property="og:title" content="Get EMOY">
<meta property="og:description" content="One shared baby record every caregiver writes to. You choose what leaves the household.">
<meta property="og:image" content="https://emoy.app/og/get.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="EMOY: One shared baby log for the whole village. For parents, grandparents and nannies. Free on iPhone and Android.">
<meta property="og:url" content="https://emoy.app/get">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://emoy.app/og/get.png">
<meta name="twitter:image:alt" content="EMOY: One shared baby log for the whole village. For parents, grandparents and nannies. Free on iPhone and Android.">
<meta name="robots" content="noindex, follow">

<link rel="stylesheet" href="style.css">

<style>

  --cream:#f5ead8; --ink:#201e1d; --body:#3c3733; --terra-deep:#9c4f1d;
  background:var(--cream); color:var(--body);
  font:400 17px/1.6 "Figtree",-apple-system,"Segoe UI",sans-serif;
  min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:40px 22px; -webkit-font-smoothing:antialiased; text-align:center;
}
.lp-redirect main{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:16px}
.lp-redirect img{width:56px;height:56px;display:block}

.lp-redirect a{color:var(--terra-deep);text-decoration:underline;text-underline-offset:3px;font-weight:600}
</style>
</head>
<body class="lp lp-redirect">
<main>
  <img src="mark.png" alt="EMOY" width="56" height="56">

</main>
<script>location.replace('/get');</script>
</body>
